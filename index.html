$('#voiceList').addEventListener('click',e=>{
 const au=e.target.closest('[data-audition]');if(au){e.stopPropagation();audition(au.dataset.audition);return}
 const rm=e.target.closest('[data-rmvoice]');if(rm){e.stopPropagation();removeVoice(rm.dataset.rmvoice);return}
 if(e.target.closest('[data-consent]'))return;
 const v=e.target.closest('[data-voice]');if(v&&v.dataset.voice!==S.voice){S.voice=v.dataset.voice;renderVoices();renderAll()}
});
$('#voiceList').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset.voice){e.preventDefault();e.target.click()}});
$('#voiceList').addEventListener('change',e=>{const c=e.target.closest('[data-consent]');if(c){const v=S.customVoices.find(x=>x.id===c.dataset.consent);if(v){v.consent=c.checked;renderVoices();renderAll()}}});
function audition(id){const v=[...VOICES,...S.customVoices].find(x=>x.id===id);if(!v)return;const c=ctx();
 if(v.buffer){const s=c.createBufferSource();s.buffer=v.buffer;s.connect(audio.master);s.start();return}
 const base=v.range[0]+7;const t=c.currentTime+.05;[0,2,4,7,4,2,0].forEach((d,k)=>vocalNote(c,audio.master,t+k*.32,.3,hz(base+d),k?hz(base+[0,2,4,7,4,2,0][k-1]):0,{vibRate:5.6,vibDepth:.014,fs:v.fs,vol:.9,vowel:0,consonant:false}));}

$('#inspBody').addEventListener('click',e=>{
 const t=e.target.closest('button,input[type=radio]');if(!t)return;const d=t.dataset;
 const one=selIdx();
 if(d.kind!=null&&one.length===1)setKind(one[0],d.kind);
 else if(d.tr)transpose(+d.tr);
 else if(d.dur!=null)setDur(+d.dur);
 else if(d.gop)selectPhrase(d.gop,false),scrollToIdx(D.byKey[d.gop]?.idx[0]??0);
 else if(d.seg){S.gen.segMode=d.seg;renderAll();const n=D.phrases.length;toast(`分句已改为“${{rest:'每个休止断句',short:'短休止不断',long:'尽量长段'}[d.seg]}”，现在 ${n} 句；改变了范围的乐句需要重新渲染`)}
 else if(d.act==='segclear')segCmd(()=>S.events.forEach(e=>delete e.seg),'已清除所有手动分句标记')
 else if(d.preset){S.gen.preset=d.preset;if(PRESETS[d.preset]){S.gen.cfg=PRESETS[d.preset].cfg;S.gen.temp=PRESETS[d.preset].temp}renderAll()}
 else if(d.seedmode){S.gen.seedMode=d.seedmode;renderAll()}
 else if(d.takep){S.curPhrase=d.takep;renderAll()}
 else if(d.apip){S.apiPhrase=d.apip;renderInspector()}
 else if(d.act==='newtake'){const p=curPhrase();if(p){S.curPhrase=p.key;enqueue(p.key)}}
 else if(d.act==='solo'){const p=curPhrase();if(p)play(p.key)}
 else if(d.act==='cancel'){const p=curPhrase();if(p)cancelOne(p.key)}
 else if(d.act==='delete')delSel(false);
 else if(d.act==='transpose')transposeDlg();
 else if(d.act==='delgap')delSel(true);
 else if(d.act==='copyapi')copyApi();
 else if(d.pick){const p=curPhrase();S.renders[p.key].active=d.pick;renderAll()}
 else if(d.playtake){const p=curPhrase();const tk=S.renders[p.key].takes.find(x=>x.id===d.playtake);if(tk&&!takeUsable(tk))return toast(`版本 ${tk.n} 的音频没有保存下来，无法试听；重新渲染这一句即可`);play(p.key,tk)}
 else if(d.pgseed){const p=curPhrase(),o=p&&S.phraseGen[p.key];if(o){o.seedMode=d.pgseed;renderAll()}}
 else if(d.fav){const p=curPhrase(),t=p&&S.renders[p.key].takes.find(x=>x.id===d.fav);if(t){t.fav=!t.fav;renderAll()}}
 else if(d.deltake){const p=curPhrase();const r=S.renders[p.key];r.takes=r.takes.filter(x=>x.id!==d.deltake);audioDrop([d.deltake]);if(r.active===d.deltake)r.active=r.takes.length?r.takes[r.takes.length-1].id:null;renderAll()}
});
$('#inspBody').addEventListener('input',e=>{const t=e.target;
 if(t.dataset.g){const k=t.dataset.g;S.gen[k]=+t.value;S.gen.preset=k==='cfg'||k==='temp'?'custom':S.gen.preset;const lab=$('#v_'+k);if(lab)lab.textContent=(+t.value).toFixed(t.step<1?(t.step<.1?2:1):0);derive();renderRuler();renderLanes();renderStatus();renderTopbar();persist();
  $$('#inspBody [data-preset]').forEach(b=>b.classList.toggle('on',b.dataset.preset===S.gen.preset))}
 else if(t.id==='gSeed'){S.gen.seed=Math.floor(+t.value||0);persist()}
 else if(t.dataset.pg){const p=curPhrase(),o=p&&S.phraseGen[p.key];if(!o)return;o[t.dataset.pg]=+t.value;const lab=$('#pv_'+t.dataset.pg);if(lab)lab.textContent=(+t.value).toFixed(t.step<1?(t.step<.1?2:1):0);derive();renderRuler();renderLanes();renderStatus();renderTopbar();persist()}
 else if(t.id==='pgSeed'){const p=curPhrase(),o=p&&S.phraseGen[p.key];if(o){o.seed=Math.floor(+t.value||0);derive();renderRuler();persist()}}
});
$('#inspBody').addEventListener('change',e=>{const t=e.target;const one=selIdx();
 if(t.id==='pLyric'&&one.length===1){const toks=tokenize(t.value.trim());if(!toks.length)return;const i=one[0];commit(()=>{let j=i,k=0;while(j<S.events.length&&k<toks.length){if(S.events[j].kind==='note'){applyWord(S.events[j],toks[k]);k++}j++}})}
 else if(t.id==='pPitch'&&one.length===1){const v=clampP(Math.round(+t.value));commit(()=>S.events[one[0]].pitch=v);tone(v)}
 else if(t.id==='gLyricsOnly'){S.gen.lyricsOnly=t.checked;renderAll()}
 else if(t.id==='keySel'){const v=t.value;commit(()=>{S.key=v==='auto'?null:{mode:v.slice(0,3),r:+v.slice(3)}});toast(v==='auto'?'调性改为自动推测':`调性设为 ${keyName(S.key)}`)}
 else if(t.id==='scaleHL'){PREFS.scaleHL=t.checked;savePrefs();renderAll()}
 else if(t.id==='scaleSnap'){PREFS.scaleSnap=t.checked;savePrefs();toast(t.checked?'拖动音符时只落在调内音上':'拖动音符按半音移动')}
 else if(t.id==='pgOn'){const p=curPhrase();if(!p)return;if(t.checked){const g=S.gen;S.phraseGen[p.key]={cfg:g.cfg,temp:g.temp,steps:g.steps,seedMode:g.seedMode,seed:g.seed}}else delete S.phraseGen[p.key];renderAll()}
 else if(t.id==='autoRender'){PREFS.autoRender=t.checked;savePrefs();renderStatus();if(t.checked){toast('停止编辑约 3 秒后自动渲染改动的乐句');scheduleAuto()}}
 else if(t.id==='segRest'){S.gen.segRest=+t.value;renderAll()}
 else if(t.id==='segMax'){S.gen.segMaxSec=+t.value;renderAll()}
});
$('#status').addEventListener('click',e=>{if(!e.target.closest('#stIssues'))return;
 if(!D.issues.length)return toast('乐谱没有问题，可以渲染');
 dialog(`检查结果（${D.issues.length}）`,D.issues.map((x,k)=>`<button class="issue ${x.lv}" data-iss="${k}"><span class="ic"></span><span>${esc(x.msg)}</span></button>`).join(''),null,o=>{
  o.querySelectorAll('[data-iss]').forEach(b=>b.onclick=()=>{const x=D.issues[+b.dataset.iss];closeDialog();if(x.i!=null){S.sel=new Set([S.events[x.i].id]);S.tab='props';renderAll();scrollToIdx(x.i)}else if(x.key)selectPhrase(x.key,false)})})});

// A button clicked with the mouse gives its focus back, so Space keeps meaning play/stop (as in audio editors)
// instead of pressing that button again. Buttons reached with Tab keep focus and still respond to Space/Enter.
// (capture phase + event path: some buttons redraw their icon on click, which detaches the clicked element)
document.addEventListener('click',e=>{const b=e.composedPath().find(n=>n.tagName==='BUTTON');if(b&&e.detail>0&&!b.closest('.menu,#overlay')&&document.activeElement===b)b.blur()},true);
document.addEventListener('keydown',e=>{
 if(!$('#overlay').hidden){if(e.key==='Escape'&&!$('#overlay [data-modal]'))closeDialog();return}
 if((e.key===' '||e.key==='Enter')&&(e.target.tagName==='BUTTON'||e.target.id==='tc')&&!openMenu)return;
 if(openMenu){if(e.key==='Escape'){e.preventDefault();openMenu.remove();openMenu=null}else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const bs=[...openMenu.querySelectorAll('button:not([disabled])')];if(bs.length){const i=bs.indexOf(document.activeElement);bs[(i+(e.key==='ArrowDown'?1:bs.length-1))%bs.length].focus()}}return}
 const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable)return;
 const mod=e.ctrlKey||e.metaKey;const k=e.key;
 if(mod&&k.toLowerCase()==='z'){e.preventDefault();e.shiftKey?doRedo():undo();return}
 if(mod&&k.toLowerCase()==='y'){e.preventDefault();doRedo();return}
 if(mod&&k.toLowerCase()==='a'){e.preventDefault();S.sel=new Set(S.events.map(x=>x.id));renderAll();return}
 if(mod&&k.toLowerCase()==='r'){e.preventDefault();renderPending();return}
 if(mod&&k.toLowerCase()==='i'){e.preventDefault();importDlg();return}
 if(mod&&k.toLowerCase()==='e'){e.preventDefault();exportDlg();return}
 if(mod&&k.toLowerCase()==='g'){e.preventDefault();gotoPos();return}
 if(mod&&(k==='ArrowLeft'||k==='ArrowRight')){e.preventDefault();jumpPhrase(k==='ArrowRight'?1:-1);return}
 if(mod)return;
 if(e.code==='Comma'||e.code==='Period'){e.preventDefault();nudge(e.code==='Period'?1:-1,e.shiftKey);return}
 switch(k){
  case ' ':e.preventDefault();if(e.shiftKey)playFromSelection();else togglePlay();break;
  case 'l':case 'L':locateSelection();break;
  case 'k':case 'K':e.preventDefault();transposeDlg();break;
  case 's':case 'S':e.preventDefault();e.shiftKey?mergeAtPlayhead():splitAtPlayhead();break;
  case 't':case 'T':e.preventDefault();cycleTake(e.shiftKey?-1:1);break;
  case 'f':case 'F':e.preventDefault();toggleFav();break;
  case 'Escape':if(openMenu){openMenu.remove();openMenu=null}else if(audio.playing||S.playhead)stop();else{S.sel.clear();renderAll()}break;
  case 'Home':e.preventDefault();seek(0);roll.scrollLeft=0;break;
  case 'End':e.preventDefault();seek(D.total);break;
  case 'ArrowUp':case 'ArrowDown':if(S.sel.size){e.preventDefault();transpose((k==='ArrowUp'?1:-1)*(e.shiftKey?12:1))}break;
  case 'ArrowLeft':case 'ArrowRight':e.preventDefault();moveSel(k==='ArrowRight'?1:-1);break;
  case '[':stepDur(-1);break;case ']':stepDur(1);break;
  case 'Delete':case 'Backspace':e.preventDefault();delSel(e.shiftKey);break;
  case 'Enter':{const i=selIdx()[0];if(i!=null){e.preventDefault();openLyr(i)}break}
  case 'v':case 'V':setTool('select');break;case 'b':case 'B':setTool('pencil');break;case 'e':case 'E':setTool('eraser');break;
  case 'n':case 'N':insert('note');break;case 'r':case 'R':insert('rest');break;case 'm':case 'M':insert('mel');break;
  case '?':kbDlg();break;
 }
});
const mq=matchMedia('(prefers-color-scheme: dark)');(mq.addEventListener?mq.addEventListener('change',()=>{renderVoices();renderAll()}):0);
let rz=0;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{renderVoices();renderLanes();renderInspector()},150)});

setTool('select');renderVoices();
derive();
{const f=S.events.find(e=>e.word==='我')||S.events.find(e=>e.kind==='note');if(f){S.sel=new Set([f.id]);S.anchor=f.id}}
hydrateAudio(null);   // bring back the audio of rendered takes from the browser's storage
renderAll();
// first visit: walk through the main areas once
if(!(store.get('vrstudio.tour')>=TOUR_VER))setTimeout(()=>{if($('#overlay').hidden&&!tourEl)startTour(0)},700);
requestAnimationFrame(()=>{const ps=S.events.filter(e=>e.kind==='note').map(e=>e.pitch);const avg=ps.length?ps.reduce((a,b)=>a+b)/ps.length:64;roll.scrollTop=(MAXP-avg)*S.rowH-roll.clientHeight/2;renderLanes()});
updLyricCnt();
})();
