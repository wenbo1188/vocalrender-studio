<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>VocalRender Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>
/* Desktop shell detection: runs before first paint so the Windows skin applies immediately */
(function(){var d=window.vrDesktop;if(!d||!d.info)return;var c=document.documentElement.classList;c.add('desktop','win11');if(d.info.mica)c.add('mica');
 window.__vrAccent=function(hex){if(!/^#?[0-9a-f]{6}/i.test(hex||''))return;hex=hex.replace('#','').slice(0,6);var rgb=[0,2,4].map(function(i){return parseInt(hex.substr(i,2),16)});
  function mix(a){return '#'+rgb.map(function(v){var x=Math.round(a>0?v+(255-v)*a:v*(1+a));return ('0'+Math.max(0,Math.min(255,x)).toString(16)).slice(-2)}).join('')}
  var s=document.documentElement.style;s.setProperty('--sys-accent-light',mix(-.2));s.setProperty('--sys-accent-dark',mix(.52))};
 window.__vrAccent(d.info.accent)})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: framed vocal workstation — tracks & reference voices (left), score-native piano roll (center), inspector tabs (right), transport on top, validation in the status bar */
:root{
  --ground:#e8ebf1; --panel:#f7f8fb; --raised:#ffffff; --line:#d9dde6; --line-2:#c6ccd8;
  --fg:#1a1d25; --fg-2:#545c6f; --fg-3:#868da0;
  --accent:#5357e8; --accent-fg:#ffffff; --accent-soft:rgba(83,87,232,.11);
  --note:#6a6ff0; --note-fg:#ffffff; --note-2:#b8bbf8; --note-2-fg:#262a74; --note-sel:#1f2390;
  --play:#e2553f; --f0:#d4661a; --ok:#1d9a61; --warn:#bd810d; --err:#d43b3b;
  --ok-soft:rgba(29,154,97,.12); --warn-soft:rgba(189,129,13,.13); --err-soft:rgba(212,59,59,.11);
  --row-w:#fbfcfe; --row-b:#eef1f6; --row-line:#e7eaf0; --oct-line:#cbd1dc;
  --grid-bar:#bfc6d4; --grid-beat:#dce0e8; --grid-sub:#edf0f5;
  --key-w:#ffffff; --key-b:#2b2f3a; --key-line:#dfe3ea;
  --hatch:rgba(40,46,64,.07); --range:rgba(83,87,232,.10); --out:rgba(30,36,52,.045);
  --wave:#5f64ea; --wave-dim:#a4a8c4; --wave-bg:#6b6fa0;
  --shadow:0 1px 2px rgba(20,25,40,.06),0 6px 20px rgba(20,25,40,.07);
  --f-ui:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0d0f13; --panel:#15181e; --raised:#1c2028; --line:#252a34; --line-2:#323846;
  --fg:#e6e8ee; --fg-2:#a2a9b9; --fg-3:#6b7284;
  --accent:#8c8fff; --accent-fg:#0d0f13; --accent-soft:rgba(140,143,255,.14);
  --note:#7d81ff; --note-fg:#0e1018; --note-2:#3d4196; --note-2-fg:#d8daff; --note-sel:#ffffff;
  --play:#ff7461; --f0:#ffa552; --ok:#46c78c; --warn:#e8b041; --err:#ff6d6d;
  --ok-soft:rgba(70,199,140,.14); --warn-soft:rgba(232,176,65,.14); --err-soft:rgba(255,109,109,.13);
  --row-w:#181b22; --row-b:#13151b; --row-line:#1e212a; --oct-line:#2d323d;
  --grid-bar:#363c4a; --grid-beat:#252933; --grid-sub:#1d2029;
  --key-w:#d7dae2; --key-b:#1a1d24; --key-line:#a9aebb;
  --hatch:rgba(255,255,255,.045); --range:rgba(140,143,255,.08); --out:rgba(0,0,0,.22);
  --wave:#8f93ff; --wave-dim:#4c5066; --wave-bg:#7c7fa8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0d0f13; --panel:#15181e; --raised:#1c2028; --line:#252a34; --line-2:#323846;
  --fg:#e6e8ee; --fg-2:#a2a9b9; --fg-3:#6b7284;
  --accent:#8c8fff; --accent-fg:#0d0f13; --accent-soft:rgba(140,143,255,.14);
  --note:#7d81ff; --note-fg:#0e1018; --note-2:#3d4196; --note-2-fg:#d8daff; --note-sel:#ffffff;
  --play:#ff7461; --f0:#ffa552; --ok:#46c78c; --warn:#e8b041; --err:#ff6d6d;
  --ok-soft:rgba(70,199,140,.14); --warn-soft:rgba(232,176,65,.14); --err-soft:rgba(255,109,109,.13);
  --row-w:#181b22; --row-b:#13151b; --row-line:#1e212a; --oct-line:#2d323d;
  --grid-bar:#363c4a; --grid-beat:#252933; --grid-sub:#1d2029;
  --key-w:#d7dae2; --key-b:#1a1d24; --key-line:#a9aebb;
  --hatch:rgba(255,255,255,.045); --range:rgba(140,143,255,.08); --out:rgba(0,0,0,.22);
  --wave:#8f93ff; --wave-dim:#4c5066; --wave-bg:#7c7fa8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--fg);font-family:var(--f-ui);font-size:13px;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.surface{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
svg.i{width:16px;height:16px;flex:none}
/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:10px;min-width:0;overflow-x:auto;scrollbar-width:none;padding:6px 8px}
.topbar::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:8px;padding-right:6px;flex:none}
.brand b{font-weight:700;font-size:14px;letter-spacing:.01em}
.brand small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);border:1px solid var(--line-2);border-radius:4px;padding:1px 5px}
.menus{display:flex;gap:2px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 10px;border-radius:6px;border:1px solid transparent;background:transparent;white-space:nowrap;flex:none}
.btn:hover{background:var(--accent-soft)}
.btn.line{border-color:var(--line-2);background:var(--raised)}
.btn.line:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);font-weight:500}
.btn.primary:hover{filter:brightness(1.08)}
.btn.icon{width:30px;padding:0}
.btn.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.sep{width:1px;height:20px;background:var(--line);flex:none}
.proj{border:1px solid transparent;background:transparent;border-radius:6px;height:30px;padding:0 8px;width:150px;font-weight:500;flex:none}
.proj:hover,.proj:focus{border-color:var(--line-2);background:var(--raised)}
.transport{display:flex;align-items:center;gap:4px;margin-inline:auto;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:3px;flex:none}
.transport .play{background:var(--fg);color:var(--panel)}
.tc{position:relative;display:grid;grid-template-columns:auto auto;column-gap:6px;align-items:baseline;padding:0 10px;line-height:1.2;min-width:130px;cursor:pointer}
.tc .tl{font-size:9.5px;color:var(--fg-3);letter-spacing:.04em;text-align:right}
.tc .big{font-size:14px;font-weight:600}
.tc .small{font-size:10.5px;color:var(--fg-3)}
.tc:hover{background:var(--accent-soft);border-radius:5px}
.tc-input{position:absolute;inset:1px 2px;width:auto;min-width:0;border:1.5px solid var(--accent);border-radius:4px;background:var(--raised);color:var(--fg);padding:0 6px;font-size:13px;z-index:2}
.ruler .ghost{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--play);pointer-events:none;z-index:7}
.ruler .ghost span{position:absolute;top:2px;left:5px;font:600 10px/16px var(--f-mono);background:var(--raised);color:var(--fg);border:1px solid var(--line-2);border-radius:3px;padding:0 5px;white-space:nowrap;box-shadow:var(--shadow)}
.gghost{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--play);opacity:.45;pointer-events:none;z-index:6}
.startmark{position:absolute;top:0;bottom:0;width:0;border-left:2px solid color-mix(in srgb,var(--play) 40%,transparent);pointer-events:none;z-index:7}
.startmark::before{content:"";position:absolute;top:0;left:-6px;border:5px solid transparent;border-top:7px solid color-mix(in srgb,var(--play) 55%,transparent)}
.f0ref{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.f0ref path{fill:none;stroke:var(--fg-3);stroke-width:1.3;opacity:.8;stroke-linejoin:round}
.imp-segs{display:flex;flex-direction:column;gap:2px;max-height:160px;overflow:auto;margin:6px 0 12px;border:1px solid var(--line);border-radius:6px;padding:4px}
.imp-seg{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:5px 6px;border-radius:4px;cursor:pointer}
.imp-seg:hover{background:var(--accent-soft)}
.imp-seg .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp-seg .t{color:var(--fg-3);margin-left:auto;font-family:var(--f-mono);font-size:11px;white-space:nowrap}
.imp-stats{font-size:12px;line-height:1.75;color:var(--fg-2)}
.imp-stats b{color:var(--fg);font-weight:600}
.field-mini{display:flex;align-items:center;gap:4px;padding:0 6px;color:var(--fg-3);font-size:11px}
.field-mini input,.field-mini select{height:26px;border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:0 6px;width:54px;color:var(--fg);font-family:var(--f-mono);font-size:12px}
.field-mini select{width:auto;font-family:var(--f-ui)}
.svc{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-2);padding:0 8px;height:30px;border-radius:6px;flex:none;border:1px solid var(--line)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.dot.busy{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.ckpt{height:30px;border:1px solid var(--line-2);border-radius:6px;background:var(--raised);padding:0 8px;flex:none}
.render-btn{min-width:118px}
.render-btn .cnt{font-family:var(--f-mono);font-size:11px;background:color-mix(in srgb,var(--accent-fg) 22%,transparent);border-radius:9px;padding:0 6px;line-height:17px}
/* ---------- main ---------- */
.work{display:grid;grid-template-columns:252px minmax(0,1fr) 304px;gap:8px;min-height:0}
.side,.insp{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pane-scroll{overflow-y:auto;min-height:0;flex:1}
.sec{padding:12px 12px 14px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-h h3{margin:0;font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--fg-3);text-transform:uppercase}
.hint{font-size:11.5px;color:var(--fg-3);line-height:1.55;margin:0}
.track{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px;border-radius:7px;border:1px solid var(--line);background:var(--raised)}
.track+.track{margin-top:6px}
.track .sw{width:6px;height:30px;border-radius:3px;background:var(--note)}
.track .sw.bk{background:var(--wave-bg)}
.track .nm{font-weight:500;font-size:12.5px}
.track .sub{font-size:11px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.ms{display:flex;gap:3px}
.ms button{width:22px;height:20px;border-radius:4px;border:1px solid var(--line-2);background:transparent;font-size:10.5px;font-weight:600;color:var(--fg-3);padding:0}
.ms button.on{background:var(--warn);border-color:var(--warn);color:#fff}
.ms button.on.s{background:var(--ok);border-color:var(--ok)}
.vol{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--fg-3);white-space:nowrap}
input[type=range]{accent-color:var(--accent);width:100%;height:16px}
.voice{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-radius:7px;border:1px solid transparent;cursor:pointer}
.voice:hover{background:var(--accent-soft)}
.voice.sel{border-color:var(--accent);background:var(--accent-soft)}
.voice .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.voice .meta{min-width:0}
.voice .vn{font-weight:500;font-size:12.5px;display:flex;gap:6px;align-items:baseline}
.voice .vd{font-size:11px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.voice canvas{grid-column:2/4;width:100%;height:18px;display:block}
.drop{border:1.5px dashed var(--line-2);border-radius:8px;padding:12px;text-align:center;color:var(--fg-2);font-size:12px;cursor:pointer;display:block}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.consent{display:flex;gap:6px;align-items:flex-start;font-size:11px;color:var(--fg-2);grid-column:1/-1;line-height:1.45}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:1px 6px;border-radius:9px;background:var(--line);color:var(--fg-2);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.err{background:var(--err-soft);color:var(--err)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
/* ---------- editor ---------- */
.editor{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.quick{display:flex;align-items:center;gap:14px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--fg-2);background:var(--accent-soft);flex-wrap:wrap}
.quick b{color:var(--fg);font-weight:500}
.quick .st{display:flex;align-items:center;gap:6px}
.quick .n{width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:10.5px;display:grid;place-items:center;font-weight:600}
.quick .x{margin-left:0}
.toolbar{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin;flex:none}
.seg{display:flex;background:var(--raised);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px;flex:none}
.seg .btn{height:26px}
.seg .btn.icon{width:28px}
.kbd{font-family:var(--f-mono);font-size:10px;color:var(--fg-3);border:1px solid var(--line-2);border-radius:3px;padding:0 3px;line-height:14px}
.nv-sel{height:30px;border:1px solid var(--line-2);border-radius:6px;background:var(--raised);padding:0 6px;font-family:var(--f-mono);font-size:12px;flex:none}
.tb-note{font-size:11.5px;color:var(--fg-3);white-space:nowrap;margin-left:auto;padding-left:8px}
.rollwrap{flex:1;min-height:0;display:grid;grid-template-columns:64px minmax(0,1fr);grid-template-rows:44px minmax(0,1fr) auto}
.corner{border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:flex-end;padding:4px 6px;font-size:10px;color:var(--fg-3);background:var(--panel)}
.ruler{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:var(--panel);cursor:pointer;user-select:none}
.ruler-inner{position:absolute;inset:0 auto 0 0;will-change:transform}
.bar-n{position:absolute;top:2px;font-family:var(--f-mono);font-size:10.5px;color:var(--fg-2);padding-left:4px;border-left:1px solid var(--grid-bar);height:20px;line-height:18px}
.beat-t{position:absolute;top:14px;height:6px;border-left:1px solid var(--grid-beat)}
.pband{position:absolute;top:22px;height:19px;border-radius:4px;font-size:10.5px;display:flex;align-items:center;gap:5px;padding:0 6px;white-space:nowrap;overflow:hidden;border:1px solid var(--line-2);background:var(--raised);color:var(--fg-2)}
.pband .pd{width:6px;height:6px;border-radius:50%;background:var(--fg-3);flex:none}
.pband.done{border-color:color-mix(in srgb,var(--ok) 45%,transparent)}.pband.done .pd{background:var(--ok)}
.pband.stale{border-color:color-mix(in srgb,var(--warn) 55%,transparent)}.pband.stale .pd{background:var(--warn)}
.pband.error,.pband.failed{border-color:color-mix(in srgb,var(--err) 55%,transparent)}.pband.error .pd,.pband.failed .pd{background:var(--err)}
.pband.lost{border-color:color-mix(in srgb,var(--warn) 55%,transparent)}.pband.lost .pd{background:var(--warn)}
.pband.rendering .pd,.pband.queued .pd{background:var(--accent);animation:pulse 1s infinite}
.pband.cur{box-shadow:0 0 0 1.5px var(--accent)}
.pband .pf{position:absolute;inset:auto 0 0 0;height:2px;background:var(--accent);transform-origin:left}
.keys{position:relative;overflow:hidden;border-right:1px solid var(--line);background:var(--key-w)}
.keys-inner{position:absolute;left:0;right:0;top:0;will-change:transform}
.key{position:absolute;left:0;right:0;border-bottom:1px solid var(--key-line);font-size:9.5px;font-family:var(--f-mono);color:#7d8396;display:flex;align-items:center;justify-content:flex-end;padding-right:5px;cursor:pointer;background:var(--key-w)}
.key.b{background:var(--key-b);right:22px;color:transparent;z-index:1;border-bottom-color:var(--key-b)}
.key.c{color:#3f4556;font-weight:600}
.key:active{filter:brightness(.9)}
.key-range{position:absolute;right:0;width:4px;background:var(--accent);border-radius:2px;z-index:2;opacity:.7}
.roll{position:relative;overflow:auto;background:var(--row-w);overscroll-behavior:contain}
.roll-content{position:relative}
.outband{position:absolute;left:0;right:0;background:var(--out);pointer-events:none}
.rest{position:absolute;top:0;bottom:0;overflow:hidden;background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px);border-left:1px dashed var(--grid-bar);cursor:pointer}
.rest.inph{background:repeating-linear-gradient(135deg,var(--hatch) 0 3px,transparent 3px 12px);border-left-style:dotted}
.rest.inph .rl{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.segmark{position:absolute;top:20px;bottom:0;width:0;border-left:2px solid var(--accent);z-index:3;pointer-events:none}
.segmark::after{content:'断';position:absolute;top:-1px;left:2px;font-size:9px;line-height:12px;padding:0 2px;border-radius:2px;background:var(--accent);color:var(--accent-fg)}
.rest .rl{position:sticky;top:6px;display:inline-block;white-space:nowrap;margin:6px 0 0 4px;font-size:10px;font-family:var(--f-mono);color:var(--fg-3);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.rest.breath{background:repeating-linear-gradient(90deg,var(--hatch) 0 2px,transparent 2px 5px)}
.rest.sel{background-color:var(--accent-soft);outline:1.5px solid var(--accent);outline-offset:-1.5px}
.note{position:absolute;border-radius:4px;background:var(--note);color:var(--note-fg);font-size:12px;line-height:1;display:flex;align-items:center;padding-left:5px;overflow:hidden;white-space:nowrap;cursor:ns-resize;user-select:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.note.mel{background:var(--note-2);color:var(--note-2-fg);border-top-left-radius:1px;border-bottom-left-radius:1px}
.note.sel{box-shadow:0 0 0 2px var(--note-sel),inset 0 0 0 1px rgba(0,0,0,.12);z-index:3}
.note.warn::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--warn)}
.note.err{box-shadow:0 0 0 2px var(--err);z-index:2}
.note .edge{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:ew-resize}
.note .edge::after{content:"";position:absolute;right:2px;top:25%;bottom:25%;width:2px;border-radius:1px;background:currentColor;opacity:.35}
.note.dim{opacity:.55}
.nl{position:absolute;z-index:5;pointer-events:none;display:flex;align-items:center;font-size:12px;line-height:1;padding:0 2px;border-radius:3px;background:var(--note);color:var(--note-fg);overflow:hidden;white-space:nowrap}
.nl.mel{background:var(--note-2);color:var(--note-2-fg)}
.f0{position:absolute;left:0;top:0;pointer-events:none;z-index:4;overflow:visible}
.f0 path{fill:none;stroke-linejoin:round;stroke-linecap:round}
.f0 .u{stroke:var(--row-w);stroke-width:4.5;opacity:.7}

.f0 .stale{opacity:.5}
.f0 .stale .l{stroke-dasharray:4 3}
.lyr-edit{position:absolute;z-index:10;height:24px;min-width:72px;border:1.5px solid var(--accent);border-radius:4px;background:var(--raised);color:var(--fg);padding:0 6px;font-size:13px;box-shadow:var(--shadow)}
.ticks{position:absolute;height:6px;z-index:6;pointer-events:none}
.ticks i{position:absolute;top:0;width:1px;height:8px;background:var(--accent)}
.ticks i.on{height:12px;top:-2px;width:2px}
.ticks b{position:absolute;top:-18px;transform:translateX(-50%);font:600 10px var(--f-mono);background:var(--accent);color:var(--accent-fg);padding:1px 4px;border-radius:3px;white-space:nowrap}
.phead{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--play);z-index:8;pointer-events:none}
.ruler .phead::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top:7px solid var(--play)}
.lanes-l{border-right:1px solid var(--line);border-top:1px solid var(--line);background:var(--panel)}
.lanes-l div{height:46px;display:flex;flex-direction:column;justify-content:center;padding:0 7px;font-size:11px;color:var(--fg-2);border-bottom:1px solid var(--line)}
.lanes-l div small{font-size:9.5px;color:var(--fg-3)}
.lanes{position:relative;overflow:hidden;border-top:1px solid var(--line);background:var(--panel);height:93px}
.lanes-inner{position:absolute;inset:0 auto 0 0;will-change:transform}
.lane{position:relative;height:46px;border-bottom:1px solid var(--line)}
.lseg{position:absolute;top:5px;bottom:5px;border-radius:4px;overflow:hidden;font-size:10.5px;color:var(--fg-3);display:flex;align-items:center;padding-left:6px;white-space:nowrap;cursor:pointer}
.lseg canvas{position:absolute;inset:0;width:100%;height:100%}
.lseg.none{border:1px dashed var(--line-2)}
.lseg.done{background:var(--accent-soft)}
.lseg.stale{background:var(--warn-soft);color:var(--warn)}
.lseg.stale canvas{opacity:.35}
.lseg.error,.lseg.failed{border:1px dashed var(--err);color:var(--err)}
.lseg.lost{border:1px dashed var(--warn);color:var(--warn)}
.lseg .lretry{position:relative;z-index:1;margin-left:5px;height:18px;padding:0 7px;border-radius:9px;border:1px solid var(--err);background:var(--panel);color:var(--err);font-size:10.5px;cursor:pointer}
.lseg .lretry:hover{background:var(--err-soft)}
/* waveform of a take's real audio: placed where the audio actually starts and ends, which can reach past the written phrase */
.lwave{position:absolute;top:5px;bottom:5px;height:calc(100% - 10px);pointer-events:none}
.lwave.dim{opacity:.35}
.lseg .lbl{position:relative;z-index:1;background:var(--panel);border-radius:3px;padding:0 4px}
.lseg .prog{position:absolute;left:0;top:0;bottom:0;background:var(--accent-soft);border-right:2px solid var(--accent)}
.bk-seg{position:absolute;top:5px;bottom:5px;left:0;border-radius:4px;background:color-mix(in srgb,var(--wave-bg) 16%,transparent);overflow:hidden}
.bk-seg canvas{width:100%;height:100%;display:block}
.bk-empty{position:absolute;top:13px;left:8px;font-size:11px;color:var(--fg-3)}
.lyricbar{display:flex;gap:8px;align-items:center;padding:7px 8px;border-top:1px solid var(--line);flex-wrap:wrap}
.lyricbar label{font-size:11.5px;color:var(--fg-2);flex:none}
.lyricbar input{flex:1;min-width:160px;height:30px;border:1px solid var(--line-2);border-radius:6px;background:var(--raised);padding:0 10px}
.lyricbar .cnt{font-size:11.5px;color:var(--fg-3);flex:none}
.lyricbar .cnt.bad{color:var(--err)}
.lyricbar .cnt.warn{color:var(--warn)}
.lyricbar .cnt{max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nl.pv{background:var(--raised);color:var(--accent);box-shadow:0 0 0 1.5px var(--accent);font-weight:600}
.note.pvt{box-shadow:0 0 0 1.5px var(--accent),inset 0 0 0 1px rgba(0,0,0,.12)}
/* ---------- first-run tour ---------- */
.tour{position:fixed;inset:0;z-index:80}
.tour-hole{position:fixed;border-radius:8px;box-shadow:0 0 0 9999px rgba(10,12,18,.55);transition:all .25s ease;pointer-events:none;outline:2px solid var(--accent);outline-offset:2px}
.tour-hole.none{box-shadow:0 0 0 9999px rgba(10,12,18,.55);width:0!important;height:0!important;outline:0}
.tour-card{position:fixed;width:min(340px,calc(100vw - 32px));background:var(--dialog,var(--raised));color:var(--fg);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 18px 48px rgba(0,0,0,.3);padding:16px 18px 14px;transition:top .25s ease,left .25s ease}
.tour-card h3{margin:2px 0 8px;font-size:15.5px;font-weight:600}
.tour-card .tb{font-size:13px;line-height:1.7;color:var(--fg-2)}
.tour-card .tb ul{margin:6px 0 0;padding-left:18px}.tour-card .tb li{margin:2px 0}
.tour-card .tb b{color:var(--fg)}
.tour-card kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--raised)}
.tour-step{font-size:11px;color:var(--fg-3);display:flex;gap:4px;align-items:center}
.tour-step i{width:6px;height:6px;border-radius:50%;background:var(--line-2)}.tour-step i.on{background:var(--accent);width:16px;border-radius:3px}
.tour-foot{display:flex;gap:8px;align-items:center;margin-top:14px}.tour-foot .sp{flex:1}
@media (prefers-reduced-motion:reduce){.tour-hole,.tour-card{transition:none}}
/* ---------- inspector ---------- */
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 6px;flex:none}
.tab{flex:1;height:38px;border:0;background:transparent;color:var(--fg-3);font-size:12.5px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:500}
.fld{display:grid;gap:6px;margin-bottom:14px}
.fld>label,.fld .lab{font-size:11.5px;color:var(--fg-2);display:flex;justify-content:space-between;align-items:baseline}
.fld .lab .v{font-family:var(--f-mono);color:var(--fg);font-size:12px}
.inp{height:32px;border:1px solid var(--line-2);border-radius:6px;background:var(--raised);padding:0 10px;width:100%}
.inp:focus{border-color:var(--accent);outline:none}
.row{display:flex;gap:6px;align-items:center}
.grid12{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.grid12 button{height:30px;border:1px solid var(--line);border-radius:5px;background:var(--raised);font-family:var(--f-mono);font-size:11.5px;padding:0}
.grid12 button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.segs{display:flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.segs button{flex:1;height:30px;border:0;background:var(--raised);font-size:12px;border-right:1px solid var(--line)}
.segs button:last-child{border-right:0}
.segs button.on{background:var(--accent);color:var(--accent-fg)}
.card{border:1px solid var(--line);border-radius:7px;background:var(--raised);padding:10px}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--raised);cursor:pointer;text-align:left;width:100%}
.pitem:hover{border-color:var(--accent)}
.pitem .pn{font-family:var(--f-mono);font-size:11px;color:var(--fg-3)}
.pitem .pl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.chip{height:26px;padding:0 9px;border-radius:13px;border:1px solid var(--line-2);background:var(--raised);font-size:11.5px;display:inline-flex;align-items:center;gap:5px}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip .pd{width:6px;height:6px;border-radius:50%;background:var(--fg-3)}
.chip .pd.done{background:var(--ok)}.chip .pd.stale{background:var(--warn)}.chip .pd.error,.chip .pd.failed{background:var(--err)}.chip .pd.lost{background:var(--warn)}.chip .pd.rendering,.chip .pd.queued{background:var(--accent)}
.take{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--raised)}
.take+.take{margin-top:6px}
.take.act{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.take .tn{font-weight:500}
.take .tm{font-size:11px;color:var(--fg-3);font-family:var(--f-mono)}
.take canvas{grid-column:1/-1;width:100%;height:26px;display:block}
.code{font-family:var(--f-mono);font-size:11.5px;line-height:1.55;background:var(--raised);border:1px solid var(--line);border-radius:7px;padding:10px;overflow:auto;max-height:300px;white-space:pre;color:var(--fg-2);margin:0}
.code .k{color:var(--accent)}.code .s{color:var(--ok)}.code .n{color:var(--warn)}
.code.wrap{white-space:pre-wrap;word-break:break-all;max-height:140px}
.ep{display:grid;grid-template-columns:52px 1fr;gap:4px 8px;font-size:11.5px}
.ep .m{font-family:var(--f-mono);font-size:10.5px;font-weight:600;color:var(--accent)}
.ep .p{font-family:var(--f-mono);font-size:11px;word-break:break-all}
.ep .d{grid-column:2;color:var(--fg-3);margin-bottom:6px}
.issue{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:6px;font-size:12px;line-height:1.5;cursor:pointer;width:100%;border:0;text-align:left;background:transparent}
.issue:hover{background:var(--accent-soft)}
.issue .ic{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none}
.issue.err .ic{background:var(--err)}.issue.warn .ic{background:var(--warn)}
.empty{padding:22px 10px;text-align:center;color:var(--fg-3);font-size:12px;line-height:1.6}
/* ---------- status ---------- */
.status{display:flex;align-items:center;gap:14px;height:30px;padding:0 10px;font-size:11.5px;color:var(--fg-2);overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.status .spacer{flex:1}
.status button{border:0;background:transparent;display:inline-flex;align-items:center;gap:6px;padding:2px 6px;border-radius:5px;color:inherit}
.status button:hover{background:var(--accent-soft)}
/* ---------- overlays ---------- */
.menu{position:fixed;z-index:50;min-width:210px;background:var(--raised);border:1px solid var(--line-2);border-radius:8px;box-shadow:var(--shadow);padding:4px}
.menu button{display:flex;width:100%;justify-content:space-between;gap:20px;align-items:center;border:0;background:transparent;padding:7px 10px;border-radius:5px;text-align:left}
.menu button:hover{background:var(--accent-soft)}
.menu button[disabled]{opacity:.4;cursor:default}
.menu button[disabled]:hover{background:transparent}
.marquee{position:absolute;z-index:7;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);pointer-events:none;border-radius:2px}
.note.erasing,.rest.erasing,.nl.erasing{opacity:.2}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px}
.overlay{position:fixed;inset:0;z-index:60;background:rgba(10,12,18,.42);display:grid;place-items:center;padding:16px}
.dlg{width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow)}
.dlg header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg header h2{margin:0;font-size:15px;font-weight:500}
.dlg .body{padding:16px}
.pband .pu{position:absolute;left:0;bottom:0;height:2px;background:var(--fg-3);opacity:.35}
.pband .pu.hi{background:var(--warn);opacity:.9}
.segline{position:absolute;top:0;bottom:0;width:0;border-left:1.5px dashed color-mix(in srgb,var(--accent) 75%,transparent);pointer-events:none;z-index:2}
.note.ook{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0 2px,transparent 2px 6px)}
.segprev{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:8px;font-variant-numeric:tabular-nums}
.segprev th{font-weight:500;color:var(--fg-3);text-align:right;padding:3px 4px}.segprev th:first-child,.segprev td:first-child{text-align:left}
.segprev td{padding:4px;text-align:right;border-top:1px solid var(--line)}.segprev tr.cur td{color:var(--accent);font-weight:600}
.chk{gap:8px;font-size:12.5px;margin:4px 0}
.fld>label.chk{justify-content:flex-start;align-items:center;color:var(--fg);font-size:12.5px}
.pgen{margin:0 0 14px;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--raised)}
.pgen summary{cursor:pointer;font-size:12.5px;display:flex;gap:8px;align-items:center}
.take .fav{color:var(--fg-3)}.take .fav.on{color:var(--warn)}
.tp-grid{display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:center;margin-bottom:14px}
.tp-grid>.k{font-size:12px;color:var(--fg-2);white-space:nowrap}
.tp-step{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.tp-step input{width:64px;text-align:center}
.tp-iv{font-size:12px;color:var(--fg-2);margin-left:6px}
.tp-range{width:100%;height:auto;display:block;margin:2px 0 8px}
.tp-range text{font:10px var(--f-mono);fill:var(--fg-3)}
.tp-msg{font-size:12.5px;line-height:1.7}
.tp-msg .ok{color:var(--ok)}.tp-msg .warn{color:var(--warn)}.tp-msg .bad{color:var(--err)}
.dlg footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.dlg textarea{width:100%;min-height:160px;border:1px solid var(--line-2);border-radius:7px;background:var(--raised);padding:10px;font-family:var(--f-mono);font-size:12px;resize:vertical}
.kb-grid{display:grid;grid-template-columns:1fr auto;gap:7px 16px;font-size:12.5px}
.kb-grid kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:1px 6px;background:var(--raised);white-space:nowrap}
.toasts{position:fixed;left:50%;bottom:calc(46px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--fg);color:var(--panel);padding:8px 14px;border-radius:8px;font-size:12.5px;box-shadow:var(--shadow);animation:tin .18s ease-out}

@keyframes tin{from{transform:translateY(6px);opacity:0}}
.mob-only{display:none}

<body>
<div class="app" id="app">
  <header class="topbar surface" id="topbar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="var(--accent)"/><path d="M5 13v-2M8 16V8M11 18V6M14 15V9M17 13v-2M19.5 12.5v-1" stroke="var(--accent-fg)" stroke-width="1.8" stroke-linecap="round"/></svg>
      <b>VocalRender</b><small>Studio</small>
    </div>
    <button class="btn icon mob-only" id="btnSide" title="轨道与声线"></button>
    <nav class="menus">
      <button class="btn" data-menu="file"><span>文件</span></button>
      <button class="btn" data-menu="edit"><span>编辑</span></button>
      <button class="btn" data-menu="help"><span>帮助</span></button>
    </nav>
    <input class="proj" id="projName" aria-label="工程名称" value="晚风街口">
    <div class="transport" role="group" aria-label="走带控制">
      <button class="btn icon" id="btnHome" title="回到开头 (Home)"></button>
      <button class="btn icon play" id="btnPlay" title="播放 / 停止 (Space)"></button>
      <button class="btn icon" id="btnStop" title="停止并回到开头 (Esc)"></button>
      <button class="btn icon" id="btnReturn"></button>
      <button class="btn icon" id="btnFollow"></button>
      <div class="tc" id="tc" role="button" tabindex="0" title="播放头位置，单击输入要跳转的位置 (Ctrl+G)&#10;小节：小节.拍.tick（每拍 960 tick）&#10;时间：分:秒.毫秒，按当前 BPM 换算"><span class="tl">小节</span><span class="big mono" id="tcBar">1.1.000</span><span class="tl">时间</span><span class="small mono" id="tcTime">00:00.000</span></div>
      <label class="field-mini" title="速度 BPM"><span class="fl">BPM</span> <input id="bpm" aria-label="速度 BPM" type="number" min="40" max="240" step="1" value="90"></label>
      <label class="field-mini" title="拍号"><span class="fl">拍号</span> <select id="bpb" aria-label="拍号"><option value="4">4/4</option><option value="3">3/4</option><option value="2">2/4</option><option value="6">6/8</option></select></label>
    </div>
    <select class="ckpt" id="ckpt" title="模型版本">
      <option value="VocalRender-Pro">VocalRender-Pro</option>
      <option value="VocalRender">VocalRender</option>
    </select>
    <div class="svc" id="svc" title="服务状态"><span class="dot" id="svcDot"></span><span id="svcText">演示服务 · 空闲</span></div>
    <button class="btn primary render-btn" id="btnRender"></button>
    <button class="btn icon line" id="btnSettings" title="服务设置"></button>
    <button class="btn icon line mob-only" id="btnInsp" title="检查器"></button>
  </header>

  <main class="work">
    <aside class="side surface" id="side">
      <div class="pane-scroll">
        <section class="sec">
          <div class="sec-h"><h3>轨道</h3></div>
          <div class="track">
            <span class="sw"></span>
            <div><div class="nm">主唱</div><div class="sub" id="trkVoice">Alto-1</div></div>
            <div class="ms"><button id="vMute" title="静音">M</button><button id="vSolo" class="s" title="独奏">S</button></div>
            <div class="vol">音量<input id="vVol" type="range" min="0" max="1" step="0.01" value="0.85"></div>
          </div>
          <div class="track">
            <span class="sw bk"></span>
            <div><div class="nm">伴奏</div><div class="sub" id="trkBk">未导入</div></div>
            <div class="ms"><button id="bMute" title="静音">M</button><button id="bLoad" title="导入伴奏音频" style="width:auto;padding:0 6px">导入</button></div>
            <div class="vol">音量<input id="bVol" type="range" min="0" max="1" step="0.01" value="0.7"></div>
          </div>
          <input type="file" id="bkFile" accept="audio/*" hidden>
          <input type="file" id="projFile" accept=".vrproj,.json,.txt,.mid,.midi,.kar,.musicxml,.mxl,.xml" hidden>
        </section>
        <section class="sec">
          <div class="sec-h"><h3>参考声线</h3><span class="tag">2–8 秒清唱</span></div>
          <p class="hint" style="margin-bottom:10px">参考音频决定音色，不需要和歌词、旋律一致。切换声线后，已渲染的乐句会标记为需重新渲染。</p>
          <div id="voiceList"></div>
          <div style="margin-top:12px">
            <label class="drop" id="drop" for="voiceFile">上传自己的参考音频<br><span class="hint">WAV / MP3 / FLAC，干净无伴奏，2–8 秒</span></label>
            <input type="file" id="voiceFile" accept="audio/*" hidden>
          </div>
        </section>
      </div>
    </aside>

    <section class="editor surface" id="editor">
      <div class="quick" id="quick">
        <span class="st"><span class="n">1</span><b>选声线</b>左侧挑一个参考声线</span>
        <span class="st"><span class="n">2</span><b>写旋律</b>拖动音符改音高，拖右边缘改时值，双击填词</span>
        <span class="st"><span class="n">3</span><b>渲染</b>按乐句生成，可多版本对比</span>
        <button class="btn line" id="quickTour" style="margin-left:auto;height:26px">新手引导</button>
        <button class="btn icon x" id="quickX" title="关闭提示"></button>
      </div>
      <div class="toolbar">
        <div class="seg" role="group" aria-label="工具">
          <button class="btn icon" data-tool="select" title="选择 (V)"></button>
          <button class="btn icon" data-tool="pencil" title="铅笔 (B)"></button>
          <button class="btn icon" data-tool="eraser" title="橡皮 (E)"></button>
        </div>
        <select class="nv-sel" id="newDur" title="新建音符时值"></select>
        <div class="seg">
          <button class="btn" data-ins="note" title="在选中后插入音符 (N)">+ 音符</button>
          <button class="btn" data-ins="rest" title="插入休止 SP (R)">+ 休止</button>
          <button class="btn" data-ins="mel" title="插入一字多音 (M)">+ 连音</button>
          <button class="btn" data-ins="breath" title="插入换气 AP">+ 换气</button>
        </div>
        <div class="seg">
          <button class="btn icon" id="btnUndo" title="撤销 (Ctrl+Z)"></button>
          <button class="btn icon" id="btnRedo" title="重做 (Ctrl+Shift+Z)"></button>
          <button class="btn icon" id="btnDel" title="删除选中 (Delete)" disabled></button>
        </div>
        <button class="btn line on" id="btnRef" hidden title="显示导入时带来的原唱音高（f0）参考线"></button>
        <button class="btn line on" id="btnF0" title="显示渲染结果的实际音高线（F0）"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 15c2.5 0 3-6 6-6s2.5 5 5 5 2.5-7 7-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>音高线</button>
        <span class="tb-note">时值吸附 12 种音符 · 后续自动顺延</span>
        <div class="seg" style="margin-left:8px">
          <button class="btn icon" id="zOut" title="缩小">−</button>
          <button class="btn icon" id="zIn" title="放大">+</button>
        </div>
      </div>
      <div class="rollwrap">
        <div class="corner mono" id="corner">♩=90</div>
        <div class="ruler" id="ruler"><div class="ruler-inner" id="rulerIn"></div></div>
        <div class="keys" id="keys"><div class="keys-inner" id="keysIn"></div></div>
        <div class="roll" id="roll" tabindex="0" aria-label="钢琴卷帘"><div class="roll-content" id="content"></div></div>
        <div class="lanes-l"><div>人声<small>渲染结果</small></div><div>伴奏<small>参考</small></div></div>
        <div class="lanes" id="lanes"><div class="lanes-inner" id="lanesIn"></div></div>
      </div>
      <div class="lyricbar">
        <label for="lyricIn">批量歌词</label>
        <input id="lyricIn" placeholder="输入一句或整首歌词，按顺序每个音填一个字；先选中音符可只填那一段" autocomplete="off">
        <span class="cnt" id="lyricCnt"></span>
        <button class="btn icon" id="lyricHelp" title="批量歌词怎么用">?</button>
        <button class="btn line" id="lyricFill">填入音符</button>
      </div>
    </section>

    <aside class="insp surface" id="insp">
      <div class="tabs" role="tablist">
        <button class="tab" data-tab="props">属性</button>
        <button class="tab" data-tab="gen">生成</button>
        <button class="tab" data-tab="takes">版本</button>
        <button class="tab" data-tab="api">接口</button>
      </div>
      <div class="pane-scroll" id="inspBody" style="padding:14px 12px"></div>
    </aside>
  </main>

  <footer class="status surface" id="status"></footer>
</div>
<div class="overlay" id="overlay" hidden></div>
<div class="toasts" id="toasts"></div>

<script>

 for(;;){first[i]=j;if(i===0&&j===0)break;const dv=dir[i*M+j];if(dv===0){i--;j--}else if(dv===1)i--;else j--}

// Each note's stretch of the curve is drawn over that note as it stands now (matched by event id), so the line stays on
// the lyrics even when the singing timing differs from the score, or SP/AP were inserted after rendering.
function f0SVG(W,H){
 if(!S.showF0)return '';let out='';const at=new Map(S.events.map((e,i)=>[e.id,i]));
 D.phrases.forEach(p=>{if(!['done','stale','failed','lost'].includes(p.status))return;const t=activeTake(p.key);if(!t)return;const perf=takePerf(t,p);
  const legacy=perf.notes.every(n=>n.id==null),byOrder=legacy&&perf.notes.length===p.idx.length;
  let d='',pen=false,lastCi=-9;
  perf.notes.forEach((n,ni)=>{if(!n.k){pen=false;return}
   const ci=n.id!=null?at.get(n.id):byOrder?p.idx[ni]:undefined;let b0,b1;
   if(ci!=null){const e=S.events[ci];if(!e||e.kind!=='note'||D.pOf[ci]!==p){pen=false;return}
    b0=D.starts[ci];b1=b0+beats(e);if(ci!==lastCi+1)pen=false;lastCi=ci}
   else if(legacy){b0=p.start+n.sb;b1=b0+n.b}
   else{pen=false;return}
   const span=n.e-n.s;if(span<=0)return;
   const j0=Math.max(0,Math.floor(n.s/perf.hop)),j1=Math.min(perf.vals.length,Math.ceil(n.e/perf.hop));
   for(let j=j0;j<j1;j++){const m=perf.vals[j];if(m==null||isNaN(m)){pen=false;continue}
    const f=Math.min(1,Math.max(0,(j*perf.hop-n.s)/span));
    d+=(pen?'L':'M')+((b0+f*(b1-b0))*S.ppb).toFixed(1)+' '+((MAXP-m+.5)*S.rowH).toFixed(1);pen=true}});
  if(d)out+=`<g class="${p.status==='done'?'':'stale'}"><path class="u" d="${d}"/><path class="l" d="${d}"/></g>`});
 return out?`<svg class="f0" width="${W}" height="${H}" aria-hidden="true">${out}</svg>`:'';
}
// YIN pitch tracking on returned audio, used when the service does not send an f0 track
function extractF0(buf){
 const sr=buf.sampleRate,src=buf.getChannelData(0),ds=Math.max(1,Math.round(sr/16000)),fs=sr/ds,n=Math.floor(src.length/ds);
 const x=new Float32Array(n);for(let i=0;i<n;i++){let a=0;for(let j=0;j<ds;j++)a+=src[i*ds+j];x[i]=a/ds}
 const W=Math.round(fs*.04),hop=Math.round(fs*.01),minL=Math.floor(fs/900),maxL=Math.ceil(fs/60),d=new Float32Array(maxL+2),vals=[];
 for(let s=0;s+W+maxL+1<n;s+=hop){let e=0;for(let i=0;i<W;i++)e+=x[s+i]*x[s+i];if(e/W<1e-5){vals.push(null);continue}
  let run=0;d[0]=1;for(let L=1;L<=maxL+1;L++){let sum=0;for(let i=0;i<W;i++){const df=x[s+i]-x[s+i+L];sum+=df*df}run+=sum;d[L]=run?sum*L/run:1}
  let L0=-1;for(let L=minL;L<maxL;L++){if(d[L]<.15){while(L+1<maxL&&d[L+1]<d[L])L++;L0=L;break}}
  if(L0<1){vals.push(null);continue}
  const a=d[L0-1],b=d[L0],c=d[L0+1],den=a-2*b+c,sh=den?(a-c)/(2*den):0,lag=L0+Math.max(-1,Math.min(1,sh));
  vals.push(+(69+12*Math.log2(fs/lag/440)).toFixed(2))}
 return{hop:hop/fs,vals:new Array(Math.round(W/2/hop)).fill(null).concat(vals)};
}

function refSVG(W,H){const r=S.refF0;if(!r||!PREFS.showRef||!r.b||!r.b.length)return '';let d='',pen=false,lx=-9;const sh=(S.refShift||[]).length>0;

function updateMarquee(e){

 const val=el.value.trim();const i=S.events.findIndex(x=>x.id===id);if(i<0)return 0;
 const toks=tokenize(val);let used=1;
 commit(()=>{
  if(!toks.length)return;
  if(toks.length===1){applyWord(S.events[i],toks[0]);return}
  let j=i,k=0;while(j<S.events.length&&k<toks.length){const e=S.events[j];if(e.kind==='note'){applyWord(e,toks[k]);k++}j++}used=Math.max(1,k);

 });

function tokenize(s){const out=[];const re=/SP|AP|-|[㐀-鿿]|[A-Za-z']+/g;let m;while((m=re.exec(s)))out.push(m[0]);return out}

// Batch lyrics. Which notes take the characters:
//  nothing selected -> every note from the first; one note selected -> from that note on; several -> only those.
// Melisma notes ("-") and rests take no character. Fewer characters leave the remaining notes as they are; extra ones are ignored.
function lyricInfo(){const toks=tokenize($('#lyricIn').value).filter(t=>t!=='-'),words=toks.filter(t=>t!=='SP'&&t!=='AP');
 const slotOK=e=>e.kind==='note'&&e.word!=='-',sel=selIdx().filter(i=>slotOK(S.events[i]));let targets,scope;
 if(sel.length>1){targets=sel;scope='sel'}
 else if(sel.length===1){targets=S.events.map((e,i)=>i).filter(i=>i>=sel[0]&&slotOK(S.events[i]));scope='from'}
 else{targets=S.events.map((e,i)=>i).filter(i=>slotOK(S.events[i]));scope='all'}
 return{toks,words,targets,scope,slots:targets.length}}
function lyricPreview(){const v=$('#lyricIn').value.trim();if(!v)return null;const{words,targets}=lyricInfo();if(!targets.length)return null;

function updLyricCnt(){const{words,slots,scope,targets}=lyricInfo(),c=$('#lyricCnt');c.className='cnt';
 const where=scope==='sel'?`选中的 ${slots} 个音`:scope==='from'?`从选中的音到结尾（${slots} 个音）`:`从第 1 个音开始（共 ${slots} 个音）`;
 if(!words.length){c.textContent=S.events.length?(scope==='all'?`共 ${slots} 个可填字的音 · 选中音符可只填一段`:`将填入${where}`):'卷帘为空：每个字会生成一个四分音符';c.title=c.textContent;return}
 if(!S.events.some(e=>e.kind==='note')){c.textContent=`${words.length} 个字 → 生成 ${words.length} 个四分音符`;c.title=c.textContent;return}
 const n=Math.min(words.length,slots);
 c.textContent=`${words.length} 字 → ${scope==='sel'?'选中的音':scope==='from'?'从选中的音起':'从第 1 个音起'}填 ${n} 个`+(words.length<slots?` · 余下 ${slots-words.length} 个音不变`:words.length>slots?` · 多出 ${words.length-slots} 字被忽略`:' · 正好填满');
 if(words.length>slots)c.className='cnt warn';c.title=c.textContent}

const audio={ctx:null,nodes:[],jobs:[],ji:0,timer:0,playing:false,t0:0,from:0,raf:0,noise:null,master:null};
function ctx(){if(!audio.ctx){audio.ctx=new(window.AudioContext||window.webkitAudioContext)();const comp=audio.ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(audio.ctx.destination);const bus=audio.ctx.createGain();bus.connect(comp);const conv=audio.ctx.createConvolver();conv.buffer=roomIR(audio.ctx);const wet=audio.ctx.createGain();wet.gain.value=.16;bus.connect(conv);conv.connect(wet);wet.connect(comp);audio.master=bus;
 const nb=audio.ctx.createBuffer(1,audio.ctx.sampleRate,audio.ctx.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;audio.noise=nb}
 if(audio.ctx.state==='suspended')audio.ctx.resume();return audio.ctx}
const hz=p=>440*Math.pow(2,(p-69)/12);
function tone(p,len=.3){if(S.mix.vMute)return;const c=ctx();pianoNote(c,audio.master,c.currentTime+.005,Math.max(len,.25),p,.72)}
const VOW=[[800,1200,2500],[500,900,2400],[500,1700,2500],[300,2250,3000],[350,800,2300]];
function vocalNote(c,out,t,dur,f,fPrev,o){
 const nodes=[];const osc=c.createOscillator();osc.type='sawtooth';
 if(o.curve){osc.frequency.setValueCurveAtTime(o.curve,t,Math.max(.02,dur))}else if(fPrev){osc.frequency.setValueAtTime(fPrev,t);osc.frequency.exponentialRampToValueAtTime(f,t+.07)}else osc.frequency.setValueAtTime(f*.985,t),osc.frequency.exponentialRampToValueAtTime(f,t+.05);
 const lfo=c.createOscillator();lfo.frequency.value=o.vibRate;const lg=c.createGain();lg.gain.setValueAtTime(0,t);
 if(dur>.4&&!o.curve){lg.gain.setValueAtTime(0,t+.28);lg.gain.linearRampToValueAtTime(f*o.vibDepth,t+Math.min(dur,.8))}
 lfo.connect(lg);lg.connect(osc.frequency);
 const g=c.createGain();const amp=.9*o.vol;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(amp,t+(fPrev?.02:.05));g.gain.setValueAtTime(amp,Math.max(t+.05,t+dur-.06));g.gain.linearRampToValueAtTime(0,t+dur+.05);
 VOW[o.vowel].forEach((fr,k)=>{const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=fr*o.fs;bp.Q.value=[7,9,11][k];const gg=c.createGain();gg.gain.value=[1.6,.8,.45][k];osc.connect(bp);bp.connect(gg);gg.connect(g)});
 const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;const lpg=c.createGain();lpg.gain.value=.12;osc.connect(lp);lp.connect(lpg);lpg.connect(g);
 g.connect(out);osc.start(t);lfo.start(t);osc.stop(t+dur+.1);lfo.stop(t+dur+.1);nodes.push(osc,lfo);osc.onended=()=>{try{g.disconnect()}catch(e){}};
 if(!fPrev&&o.consonant){const n=c.createBufferSource();n.buffer=audio.noise;const hp=c.createBiquadFilter();hp.type='bandpass';hp.frequency.value=4200;hp.Q.value=.8;const ng=c.createGain();ng.gain.setValueAtTime(.22*o.vol,t-.015);ng.gain.exponentialRampToValueAtTime(.001,t+.05);n.connect(hp);hp.connect(ng);ng.connect(out);n.start(Math.max(c.currentTime,t-.015));n.stop(t+.06);nodes.push(n)}
 return nodes;
}
function breathNode(c,out,t,dur,vol){const n=c.createBufferSource();n.buffer=audio.noise;n.loop=true;const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1500;bp.Q.value=.7;const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.09*vol,t+dur*.4);g.gain.linearRampToValueAtTime(0,t+dur*.9);n.connect(bp);bp.connect(g);g.connect(out);n.start(t);n.stop(t+dur);n.onended=()=>{try{g.disconnect()}catch(e){}};return[n]}
function roomIR(c){const len=Math.floor(c.sampleRate*1.6),b=c.createBuffer(2,len,c.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++){const t=i/len;d[i]=(Math.random()*2-1)*Math.pow(1-t,3.2)*(i<c.sampleRate*.012?i/(c.sampleRate*.012):1)}}return b}
// Additive piano: inharmonic partials with per-partial decay, two detuned strings on the low partials, hammer noise, brightness falling over time, damper at note-off
function pianoNote(c,out,t,dur,m,vel){
 const f=hz(m),nodes=[],end=t+dur;
 const g=c.createGain();g.gain.value=1;
 const lp=c.createBiquadFilter();lp.type='lowpass';lp.Q.value=.4;
 lp.frequency.setValueAtTime(Math.min(12000,f*12+1500)*(.55+.6*vel),t);lp.frequency.exponentialRampToValueAtTime(Math.max(f*2.5,500),t+1.8);
 lp.connect(g);g.connect(out);
 const sustain=Math.max(.9,7.5*Math.pow(2,-(m-48)/13));
 const N=Math.max(3,Math.min(10,Math.floor(9000/f))),B=.00025;
 for(let n=1;n<=N;n++){
  const fn=f*n*Math.sqrt(1+B*n*n);if(fn>16000)break;
  const strike=n===1?1:Math.abs(Math.sin(Math.PI*n*.13))*1.35;
  const amp=vel*.11*strike/Math.pow(n,1.05);
  const tau=sustain/(1+.45*(n-1))/5;
  const strings=n<=2?[-1.1,1.1]:[0];
  strings.forEach(cents=>{
   const o=c.createOscillator();o.type='sine';o.frequency.value=fn*Math.pow(2,cents/1200);
   const eg=c.createGain();const a=amp/strings.length;

 const ts=r.takes,i=ts.findIndex(t=>t.id===r.active),nx=ts[((i<0?0:i)+dir+ts.length)%ts.length];r.active=nx.id;
 const was=audio.playing,sb=audio.startBeat;renderAll();
 if(was){const b=S.playhead;pause();setPlayhead(b);play();audio.startBeat=sb;renderRuler()}
 toast(`P${p.n} · 版本 ${nx.n}（${ts.indexOf(nx)+1}/${ts.length}）${nx.fav?' ★':''}${!sameScore(nx,p)?' · 基于旧乐谱':nx.hash!==p.hash?' · 非当前服务':!takeUsable(nx)?' · 音频已丢失':''}`)}
function toggleFav(){const p=targetPhrase(),t=p&&activeTake(p.key);if(!t)return toast('这一句还没有渲染');t.fav=!t.fav;renderAll();toast(t.fav?`已收藏 P${p.n} 的版本 ${t.n} ★`:`取消收藏 P${p.n} 的版本 ${t.n}`)}
// ---- phrasing at the playhead ----
function eventNearPlayhead(){const ph=S.playhead;let best=-1,bd=1e9;S.events.forEach((e,i)=>{const d=Math.abs(D.starts[i]-ph);if(d<bd){bd=d;best=i}});return best}
function splitAtPlayhead(){const i=eventNearPlayhead();if(i<0)return;const e=S.events[i],ph=D.pOf[i];
 if(e.kind==='rest'){if(!ph)return toast('这里已经在两句之间');breakAtRest(i);return}
 if(!ph||ph.idx[0]===i)return toast('这里已经是句首');splitAt(i)}
function mergeAtPlayhead(){const ph=S.playhead;let best=null,bd=1e9;
 for(let k=0;k<D.phrases.length-1;k++){const a=D.phrases[k],b=D.phrases[k+1],d=ph<a.end?a.end-ph:ph>b.start?ph-b.start:0;if(d<bd){bd=d;best=a}}

// ---- export the score ----
function vlqBytes(n){const b=[n&0x7f];n=Math.floor(n/128);while(n>0){b.unshift((n&0x7f)|0x80);n=Math.floor(n/128)}return b}
function smfTrack(evs){evs.sort((a,b)=>a[0]-b[0]||a[2]-b[2]);const out=[];let t=0;evs.forEach(([tk,bytes])=>{out.push(...vlqBytes(tk-t),...bytes);t=tk});out.push(0,0xff,0x2f,0);
 return[0x4d,0x54,0x72,0x6b,(out.length>>>24)&255,(out.length>>>16)&255,(out.length>>>8)&255,out.length&255,...out]}
const metaEv=(t,type,data,ord=0)=>[t,[0xff,type,...vlqBytes(data.length),...data],ord];
// Format 1: a conductor track (name, tempo, time signature) and the vocal with one lyric event per note ("-" for a melisma)
function scoreMidi(){const DIV=480,enc=new TextEncoder(),us=Math.round(6e7/S.bpm),txt=x=>[...enc.encode(x)];
 const cond=[metaEv(0,3,txt(S.name||'VocalRender')),metaEv(0,0x51,[(us>>16)&255,(us>>8)&255,us&255]),metaEv(0,0x58,[S.bpb,2,24,8])];
 const voc=[metaEv(0,3,txt('Vocal · '+voiceObj().name))];
 S.events.forEach((e,i)=>{if(e.kind!=='note')return;const t0=Math.round(D.starts[i]*DIV),t1=Math.round((D.starts[i]+beats(e))*DIV);
  voc.push(metaEv(t0,5,txt(e.word==='-'?'-':e.word),1),[t0,[0x90,e.pitch,96],2],[t1,[0x80,e.pitch,0],0])});
 return new Uint8Array([0x4d,0x54,0x68,0x64,0,0,0,6,0,1,0,2,(DIV>>8)&255,DIV&255,...smfTrack(cond),...smfTrack(voc)])}
// One VocalRender label entry per phrase, exactly what each render request carries as "score"
// the whole song as one token sequence, the same format the importer reads
function tokenScore(){return S.events.map(e=>`${e.kind==='note'?(e.word==='-'?'·':e.word||'啦'):e.kind==='breath'?'AP':'SP'} <P_${e.kind==='note'?e.pitch:0}> <${NV[e.dur].t}>`).join(' ')+` <BPM_${S.bpm}>`}
function scoreLabels(){return D.phrases.filter(p=>p.idx.some(i=>S.events[i].kind==='note')).map(p=>({...p.req}))}
async function exportScore(kind){if(!S.events.some(e=>e.kind==='note'))return toast('还没有音符可以导出');
 const base=(fileRef?fileRef.name.replace(/\.vrproj$/i,''):S.name)||'score';
 try{
  if(kind==='mid'){if(!DESK)return toast('网页版不能保存文件，请在桌面版导出 MIDI','err');const r=await DESK.saveFile({kind:'mid',data:scoreMidi(),defaultName:base+'.mid'});if(r)toast(`已导出 ${r.name}`);return}
  if(kind==='tok'){const txt=tokenScore();
   if(DESK){const r=await DESK.saveFile({kind:'txt',data:txt,defaultName:base+'.txt'});if(r)toast(`已导出 ${r.name}`);return}
   dialog('导出标记序列',`<p class="hint" style="margin:0 0 8px">整首一行：每个字后面是音高 &lt;P_…&gt; 和时值 &lt;NOTE_…&gt;，“·”为连音，末尾 &lt;BPM_…&gt;。可以直接粘贴回“导入乐谱”。</p><textarea id="expJson" readonly spellcheck="false" style="min-height:180px">${esc(txt)}</textarea>`,
    `<button class="btn line" data-close>关闭</button><button class="btn primary" id="expCopy">复制</button>`,o=>{o.querySelector('#expCopy').onclick=()=>{const ta=o.querySelector('#expJson'),sel=()=>{ta.focus();ta.select();toast('已选中，按 Ctrl+C 复制')};
     if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('已复制'),sel);else sel()}});return}
  const list=scoreLabels(),txt=JSON.stringify(list,null,1);
  if(DESK){const r=await DESK.saveFile({kind:'json',data:txt,defaultName:base+'.json'});if(r)toast(`已导出 ${r.name}（${list.length} 句）`);return}
  dialog('导出 VocalRender JSON',`<p class="hint" style="margin:0 0 8px">每个乐句一条（共 ${list.length} 条），格式与 VocalRender 标注 JSON 相同：word / pitch / note / pitch2word / bpm。网页版不能直接保存文件，请复制后粘贴到文件里。</p><textarea id="expJson" readonly spellcheck="false" style="min-height:220px">${esc(txt)}</textarea>`,
   `<button class="btn line" data-close>关闭</button><button class="btn primary" id="expCopy">复制</button>`,o=>{o.querySelector('#expCopy').onclick=()=>{const ta=o.querySelector('#expJson'),sel=()=>{ta.focus();ta.select();toast('已选中，按 Ctrl+C 复制')};
    if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('已复制'),sel);else sel()}})}
 catch(e){toast('导出失败：'+e.message,'err')}}

/* ================= render service ================= */
const queue=[],working=new Set();
function renderable(p){return p.status!=='error'&&p.status!=='queued'&&p.status!=='rendering'&&p.idx.some(i=>S.events[i].kind==='note')}
// phrases are rendered in score order (P1, P2, …)
const prio=p=>p.start;
// a phrase whose current score/settings match an earlier take just switches back to it
function reuseTakes(list){let n=0;list.forEach(p=>{const r=S.renders[p.key];const t=r&&[...r.takes].reverse().find(x=>x.hash===p.hash&&takeUsable(x));if(t){r.active=t.id;n++}});return n}
// what the render button renders: unrendered and changed phrases, plus ones whose last render failed or whose audio is gone
// (automatic rendering does not retry failures on its own)
function pendingPhrases(auto){return D.phrases.filter(p=>(p.status==='none'||p.status==='stale'||(!auto&&(p.status==='failed'||p.status==='lost')))&&renderable(p))}
function renderPending(){
 const busy=Object.values(S.renders).filter(r=>r.job).length;if(busy){cancelAll();return}
 const gl=D.issues.find(x=>x.global&&x.lv==='err');if(gl)return toast(gl.msg,'err');
 let list=pendingPhrases();const errs=D.phrases.filter(p=>p.status==='error').length;
 const reused=reuseTakes(list);if(reused){renderAll();list=pendingPhrases()}
 if(!list.length)return toast(reused?`${reused} 句直接用回了之前的版本，没有需要渲染的了`:errs?`${errs} 个乐句有错误，修正后才能渲染`:'所有乐句都是最新的');
 list.sort((a,b)=>prio(a)-prio(b)).forEach(p=>enqueue(p.key,true));renderAll();pump();
 toast([reused?`${reused} 句用回了之前的版本`:'',errs?`已跳过 ${errs} 个有错误的乐句`:''].filter(Boolean).join('，')||`开始渲染 ${list.length} 句，按乐句顺序进行`);
}
function enqueue(key,quiet){const p=D.byKey[key];if(!p||!renderable(p))return;
 const gl=D.issues.find(x=>x.global&&x.lv==='err');if(gl)return toast(gl.msg,'err');
 if(!batch)batch={ok:0,fail:0,streak:0,halted:null,first:null};
 const r=rec(key);r.job={state:'queued',progress:0,hash:p.hash,request:renderRequest(p),snap:snapshotOf(p),voiceId:S.voice,sec:(p.end-p.start)*60/S.bpm,abort:null};queue.push(key);if(!quiet){renderAll();pump()}}
function pump(){const conc=Math.max(1,Math.min(4,+S.service.conc||1));
 while(working.size<conc&&queue.length){const key=queue.shift(),r=S.renders[key];if(r&&r.job&&r.job.state==='queued')runJob(key,r)}}
// One run of the queue (from the first phrase queued until nothing is left). Failures are summed up in one message at the end.
// If the service cannot be reached, or several phrases fail in a row, the rest of the queue is stopped instead of failing one by one.
let batch=null;
const pn=key=>{const p=D.byKey[key];return p?'P'+p.n:'乐句'};
function haltQueue(why){if(batch&&!batch.halted)batch.halted={why,left:queue.filter(k=>S.renders[k]&&S.renders[k].job).length};
 queue.splice(0).forEach(k=>{const r=S.renders[k];if(r&&r.job&&r.job.state==='queued')r.job=null})}
function endBatch(){const b=batch;batch=null;if(!b)return;
 if(b.halted){const left=b.halted.left?`，还有 ${b.halted.left} 句没有提交`:'';
  toast(b.halted.why==='conn'?`无法连接渲染服务，已停止渲染${left}。请检查服务地址或服务是否在运行，然后在失败的乐句上点“重试”或再次点“渲染”。`
   :`连续 ${b.streak} 句渲染失败，已停止渲染${left}。${b.first}`,'err');return}
 if(b.fail)toast(`${b.ok?b.ok+' 句渲染完成，':''}${b.fail} 句渲染失败（${b.first}）。可以在失败的乐句上点“重试”。`,'err');
 else if(b.ok&&!autoRun)toast('渲染完成');
}
async function runJob(key,r){
 working.add(key);r.job.state='rendering';const t0=performance.now();renderAll();const b=batch;
 try{
  const res=await Client.render(r.job.request,pr=>{if(!r.job)return;r.job.progress=pr;liveProgress(key)},r.job);
  if(!r.job)throw new Error('cancelled');
  const seed=r.job.request.generation.seed??res.seed;
  const t={id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),n:(r.takes.reduce((m,x)=>Math.max(m,x.n),0))+1,seed,hash:r.job.hash,params:r.job.request.generation,ckpt:r.job.request.checkpoint,voice:(allVoices().find(v=>v.id===r.job.voiceId)||voiceObj()).name,at:Date.now(),
   svc:res.svc||'remote',buffer:res.buffer||null,dur:res.buffer?+res.buffer.duration.toFixed(3):undefined,snap:r.job.snap,f0:res.f0||null};
  if(res.wav)audioPut(t.id,res.wav);   // keep the audio across reloads
  noteRate((performance.now()-t0)/1000,r.job.sec);
  r.takes.push(t);r.active=t.id;r.job=null;delete r.fail;
  if(b){b.ok++;b.streak=0}
 }catch(err){if(r.job){const hash=r.job.hash;r.job=null;
   if(err.message!=='cancelled'){r.fail={msg:err.message,hash,at:Date.now()};
    if(b){b.fail++;b.streak++;if(!b.first)b.first=`${pn(key)}：${err.message}`;if(err.conn)haltQueue('conn');else if(b.streak>=3)haltQueue('streak')}
    else toast(`${pn(key)} 渲染失败：${err.message}`,'err')}}}
 working.delete(key);
 if(!queue.length&&!working.size&&!Object.values(S.renders).some(x=>x.job)&&batch===b)endBatch();
 renderAll();pump();
}
// rendering speed (seconds of work per second of audio), remembered per service to estimate waiting time
function rateKey(){return 'vrstudio.rate.'+(S.service.mode==='demo'?'demo':S.service.base)}
function noteRate(work,sec){if(!(sec>0))return;const k=rateKey(),old=store.get(k),v=work/sec;store.set(k,old?old*.7+v*.3:v)}
function estimate(sec){const r=store.get(rateKey());if(!r||!sec)return '';const t=sec*r/Math.max(1,Math.min(4,+S.service.conc||1));return t<60?`约 ${Math.max(1,Math.round(t))} 秒`:`约 ${Math.round(t/60)} 分钟`}
// optional: render what changed after editing pauses for a few seconds
let autoT=0,autoRun=false;
function scheduleAuto(){if(!PREFS.autoRender)return;clearTimeout(autoT);autoT=setTimeout(autoRenderNow,3000)}
function autoRenderNow(){if(!PREFS.autoRender)return;if(drag||lyrEdit||!$('#overlay').hidden){scheduleAuto();return}
 if(D.issues.some(x=>x.global&&x.lv==='err'))return;
 let list=pendingPhrases(true);if(!list.length)return;if(reuseTakes(list)){renderAll();list=pendingPhrases(true)}
 if(!list.length)return;autoRun=true;list.sort((a,b)=>prio(a)-prio(b)).forEach(p=>enqueue(p.key,true));renderAll();pump();
 const done=()=>{if(working.size||queue.length)return setTimeout(done,500);autoRun=false};done()}
function liveProgress(key){
 const p=D.byKey[key];if(!p)return;const r=S.renders[key];const pr=r.job?r.job.progress:0;
 const band=$(`.pband[data-key="${key}"]`);if(band){let f=band.querySelector('.pf');if(!f){f=document.createElement('span');f.className='pf';band.appendChild(f)}f.style.transform=`scaleX(${pr})`}
 const seg=$(`.lseg[data-key="${key}"]`);if(seg){seg.innerHTML=`<span class="prog" style="width:${pr*100}%"></span><span class="lbl">渲染中 ${Math.round(pr*100)}%</span>`}
 renderTopbar();
}
function cancelAll(){queue.length=0;batch=null;autoRun=false;clearTimeout(autoT);Object.values(S.renders).forEach(r=>{if(r.job){r.job.abort&&r.job.abort();r.job=null}});renderAll();toast('已取消渲染')}
function cancelOne(key){const r=S.renders[key];if(!r||!r.job)return;const qi=queue.indexOf(key);if(qi>=0)queue.splice(qi,1);r.job.abort&&r.job.abort();r.job=null;renderAll()}

// a network failure (service down, wrong address, blocked): the whole queue stops instead of failing phrase by phrase
const connErr=()=>Object.assign(new Error('无法连接服务，请检查服务地址'),{conn:true});
const Client={
 async render(req,onProgress,job){
  if(S.service.mode==='demo')return mockRender(req,onProgress,job);
  const ac=new AbortController();job.abort=()=>ac.abort();
  const base=S.service.base.replace(/\/$/,''),auth=S.service.key?{Authorization:'Bearer '+S.service.key}:{},H={'Content-Type':'application/json',...auth};
  const v=allVoices().find(x=>x.id===job.voiceId);
  // an uploaded reference voice is sent to the service first (POST /voices); the render request then names its upload_id
  const submit=async force=>{const body={...req};
   if(v&&v.kind==='custom')body.prompt_audio={upload_id:await uploadVoice(v,base,auth,force),duration:+v.dur.toFixed(2)};
   return http(base+'/render',{method:'POST',headers:H,body:JSON.stringify(body),signal:ac.signal}).catch(e=>{throw ac.signal.aborted?new Error('cancelled'):connErr()})};
  let r=await submit(false);
  if(!r.ok){const msg=await errText(r);
   // the service may have forgotten an earlier upload (restart, expiry): upload again once and retry
   if(v&&v.kind==='custom'&&/upload/i.test(msg)){r=await submit(true);if(!r.ok)throw new Error(await errText(r))}else throw new Error(msg)}
  const{job_id}=await r.json();
  for(;;){await sleep(700);if(ac.signal.aborted)throw new Error('cancelled');const s=await http(`${base}/jobs/${job_id}`,{headers:auth,signal:ac.signal}).catch(e=>{throw ac.signal.aborted?new Error('cancelled'):connErr()});if(!s.ok)throw new Error(await errText(s));const j=await s.json();
   onProgress(j.progress||0);
   if(j.status==='succeeded'){const a=await http(j.audio_url?new URL(j.audio_url,base+'/').toString():`${base}/jobs/${job_id}/audio`,{headers:auth,signal:ac.signal});if(!a.ok)throw new Error('下载渲染结果失败：'+await errText(a));const wav=await a.arrayBuffer(),buf=await ctx().decodeAudioData(wav.slice(0));const f0=j.f0&&Array.isArray(j.f0.hz)?{hop:+j.f0.hop_s||.01,vals:j.f0.hz.map(h=>h>0?+(69+12*Math.log2(h/440)).toFixed(2):null)}:extractF0(buf);return{buffer:buf,wav,svc:'remote',seed:j.seed,f0}}
   if(j.status==='failed')throw new Error(j.error||j.detail||'服务端渲染失败')}
 },
 async health(){if(S.service.mode==='demo')return '演示服务正常';const r=await http(S.service.base.replace(/\/$/,'')+'/health');if(!r.ok)throw new Error('HTTP '+r.status);return '连接成功'}
};
async function errText(r){try{const j=await r.json();return j.detail||j.error||('HTTP '+r.status)}catch(e){return 'HTTP '+r.status}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function allVoices(){return[...VOICES,...S.customVoices]}
function bytesToB64(u){let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
// Reference audio as a mono 16-bit WAV (at most 20 s): what gets uploaded and stored with the project
function voiceWav(v){if(v._wav)return v._wav;const b=v.buffer;if(!b)throw new Error(`参考声线「${v.name}」的音频还没有载入，请稍后再试或重新上传`);
 const n=Math.min(b.length,Math.round(b.sampleRate*20)),mono=new Float32Array(n);
 for(let c=0;c<b.numberOfChannels;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)mono[i]+=d[i]/b.numberOfChannels}
 return v._wav=encodeWav({numberOfChannels:1,sampleRate:b.sampleRate,length:n,getChannelData:()=>mono},16)}
function voiceB64(v){return v._b64||(v._b64=bytesToB64(voiceWav(v)))}
function multipart(fields){const bd='----VocalRenderStudio'+Math.random().toString(16).slice(2),enc=new TextEncoder(),parts=[];
 Object.entries(fields).forEach(([k,v])=>{if(v&&v.data)parts.push(enc.encode(`--${bd}\r\nContent-Disposition: form-data; name="${k}"; filename="${v.name}"\r\nContent-Type: ${v.type}\r\n\r\n`),v.data,enc.encode('\r\n'));
  else parts.push(enc.encode(`--${bd}\r\nContent-Disposition: form-data; name="${k}"\r\n\r\n${v}\r\n`))});
 parts.push(enc.encode(`--${bd}--\r\n`));const out=new Uint8Array(parts.reduce((a,x)=>a+x.length,0));let o=0;parts.forEach(x=>{out.set(x,o);o+=x.length});
 return{body:out,type:'multipart/form-data; boundary='+bd}}
async function uploadVoice(v,base,auth,force){v.uploads=v.uploads||{};if(!force&&v.uploads[base])return v.uploads[base];
 const{body,type}=multipart({file:{name:'reference.wav',type:'audio/wav',data:voiceWav(v)},name:v.name});
 const r=await http(base+'/voices',{method:'POST',headers:{...auth,'Content-Type':type},body}).catch(()=>{throw connErr()});
 if(!r.ok)throw new Error('上传参考音频失败：'+await errText(r));
 const j=await r.json().catch(()=>({}));if(!j.upload_id)throw new Error('上传参考音频失败：服务没有返回 upload_id');
 return v.uploads[base]=j.upload_id}
// Uploaded voices saved with a project (or the browser's autosave) come back from their stored WAV
function restoreVoices(list){
 const vs=list.filter(x=>x&&x.id&&x.wav).map(x=>({id:x.id,kind:'custom',name:x.name||'我的声线',dur:+x.dur||0,sr:+x.sr||48000,ch:+x.ch||1,consent:!!x.consent,range:[MINP,MAXP],fs:1,buffer:null,_b64:x.wav,uploads:{}}));
 S.customVoices=[...S.customVoices.filter(v=>!vs.some(x=>x.id===v.id)),...vs];
 vs.forEach(v=>{try{v._wav=b64ToBytes(v._b64)}catch(e){return}
  new OfflineAudioContext(1,1,48000).decodeAudioData(v._wav.slice().buffer).then(b=>{v.buffer=b;if(document.getElementById('voiceList'))renderVoices()})
   .catch(()=>toast(`参考声线「${v.name}」的音频无法读取，请重新上传`,'err'))});
}
function removeVoice(id){const v=S.customVoices.find(x=>x.id===id);if(!v)return;S.customVoices=S.customVoices.filter(x=>x!==v);if(S.voice===id)S.voice='Alto-1';renderVoices();renderAll();toast(`已移除参考声线「${v.name}」`)}
function mockRender(req,onProgress,job){return new Promise((res,rej)=>{
 const total=900+req.score.pitch.length*110*(req.generation.inference_timesteps/10);const t0=performance.now();
 const iv=setInterval(()=>{const pr=Math.min(1,(performance.now()-t0)/total);onProgress(pr);if(pr>=1){clearInterval(iv);res({seed:Math.floor(Math.random()*1e9),svc:'demo'})}},90);
 job.abort=()=>{clearInterval(iv);rej(new Error('cancelled'))};})}

// Token-sequence score: `阳 <P_57> <NOTE_8> 光 <P_62> <NOTE_8> … SP <P_0> <NOTE_8> <BPM_120>`
// A word is followed by its pitch and note value; `·` / `-` / `~` (or a pitch+value with no word before it) continues the
// previous word on a new pitch (melisma); SP = rest, AP = breath; <BPM_n> sets the tempo.
const isTokenScore=t=>/<P_\d+>/.test(t)&&/<NOTE_[A-Z0-9_]+>/.test(t);
function parseTokenScore(text){
 const idx=Object.fromEntries(NV.map((n,k)=>[n.t,k])),ev=[],bpms=[],toks=text.split(/\s+|(?=<)|(?<=>)/).map(x=>x.trim()).filter(Boolean);
 let word=null,pit=null,val=null,hadNote=false,mel=0,n=0;
 const flush=at=>{if(pit==null&&val==null)return;
  if(pit==null||val==null)throw new Error(`第 ${at} 个标记附近：${pit==null?'缺少音高 <P_…>':'缺少时值 <NOTE_…>'}`);
  let w=word;if(w==null){if(!hadNote)throw new Error('开头缺少歌词');w='-'}
  if(/^[·\-~～–—]$/.test(w))w='-';
  if(w==='-'){const prev=ev[ev.length-1];if(!prev||prev.kind!=='note')throw new Error(`第 ${at} 个标记附近：连音“${word||'·'}”前面没有字`);mel++}
  const k=val;if(w==='SP'||w==='AP'||(pit===0&&w!=='-'))ev.push({id:uid(),kind:w==='AP'?'breath':'rest',word:w==='AP'?'AP':'SP',pitch:0,dur:k});
  else ev.push({id:uid(),kind:'note',word:w,pitch:pit,dur:k});
  hadNote=true;word=null;pit=null;val=null};
 toks.forEach((t,i)=>{n=i+1;let m;
  if((m=t.match(/^<P_(\d+)>$/))){if(pit!=null)flush(n);pit=+m[1];if(pit>127)throw new Error(`第 ${n} 个标记：音高 ${t} 超出范围`)}
  else if((m=t.match(/^<(NOTE_[A-Z0-9_]+)>$/))){if(val!=null)flush(n);if(!(m[1] in idx))throw new Error(`第 ${n} 个标记：不支持的时值 ${t}`);val=idx[m[1]]}
  else if((m=t.match(/^<BPM_(\d+(?:\.\d+)?)>$/))){flush(n);bpms.push(+m[1])}
  else if(/^<.*>$/.test(t)){/* other control tokens are ignored */}
  else{flush(n);word=t}
  if(pit!=null&&val!=null)flush(n)});
 flush(n);if(word!=null&&word!=='SP'&&word!=='AP')throw new Error(`最后的“${word}”没有音高和时值`);
 if(!ev.length)throw new Error('没有找到音符');
 return{ev,bpm:bpms.length?Math.round(bpms[0]):null,bpmVaries:new Set(bpms).size>1,mel}}
function fromLabel(d){
 ['word','pitch','note','pitch2word'].forEach(k=>{if(!Array.isArray(d[k]))throw new Error(`缺少 ${k} 字段`)});
 if(d.pitch.length!==d.note.length||d.pitch.length!==d.pitch2word.length)throw new Error('pitch、note、pitch2word 长度不一致');
 const idx=Object.fromEntries(NV.map((n,k)=>[n.t,k]));let last=-1;
 return d.pitch.map((p,k)=>{const t=String(d.note[k]).replace(/[<>]/g,'');if(!(t in idx))throw new Error(`不支持的时值 ${d.note[k]}`);
  const wi=d.pitch2word[k];const w=d.word[wi];const mel=wi===last;last=wi;
  if(w==='SP')return{id:uid(),kind:'rest',word:'SP',pitch:0,dur:idx[t]};if(w==='AP')return{id:uid(),kind:'breath',word:'AP',pitch:0,dur:idx[t]};
  return{id:uid(),kind:'note',word:mel?'-':w,pitch:+p,dur:idx[t]}});
}

// Offline mix of the active takes (unrendered phrases are silent), for WAV export
// how a phrase is exported: 'cur' = its up-to-date take, 'old' = a take from before the last change, '' = silence
// (simulated takes only count in demo mode; with a real service they would export the built-in synth as if it were the singer)
function exportKind(p){const t=activeTake(p.key);if(!t||!(t.buffer||(takeSvc(t)==='demo'&&S.service.mode==='demo')))return '';return t.hash===p.hash?'cur':'old'}
async function renderMix(o){
 ctx();const sr=48000,spb=60/S.bpm;let from=0,end=D.total,key=null;
 if(o.range==='phrase'){const p=D.byKey[o.key];if(!p)throw new Error('找不到当前乐句');key=p.key;from=p.start;end=p.end}
 if(end<=from)throw new Error('没有可导出的内容');
 // export until the takes' audio ends, not just at the written end
 D.phrases.forEach(p=>{if((key&&p.key!==key)||!exportKind(p))return;const t=activeTake(p.key);if(t)end=Math.max(end,takeEnd(t,p))});
 let sec=(end-from)*spb+1.6;if(o.backing&&S.backing&&!key)sec=Math.max(sec,S.backing.buffer.duration+.3);
 const oc=new OfflineAudioContext(2,Math.ceil(sec*sr),sr);
 const comp=oc.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(oc.destination);const bus=oc.createGain();bus.connect(comp);
 const conv=oc.createConvolver();conv.buffer=roomIR(oc);const wet=oc.createGain();wet.gain.value=.16;bus.connect(conv);conv.connect(wet);wet.connect(comp);
 scheduleRange(from,key,null,{c:oc,master:bus,sink:[],t0:.05,exp:true,backing:!!o.backing});
 return await oc.startRendering();
}
function encodeWav(buf,bits){
 const ch=buf.numberOfChannels,sr=buf.sampleRate,n=buf.length,bps=bits/8,size=n*ch*bps,ab=new ArrayBuffer(44+size),v=new DataView(ab);
 const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
 w(0,'RIFF');v.setUint32(4,36+size,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);v.setUint32(24,sr,true);v.setUint32(28,sr*ch*bps,true);v.setUint16(32,ch*bps,true);v.setUint16(34,bits,true);w(36,'data');v.setUint32(40,size,true);
 const chans=[...Array(ch)].map((_,c)=>buf.getChannelData(c));let peak=0;chans.forEach(d=>{for(let i=0;i<n;i++){const a=Math.abs(d[i]);if(a>peak)peak=a}});
 const g=peak>.98?.98/peak:1,max=bits===16?32767:8388607;let o=44;
 for(let i=0;i<n;i++)for(let c=0;c<ch;c++){const q=Math.round(Math.max(-1,Math.min(1,chans[c][i]*g))*max);
  if(bits===16){v.setInt16(o,q,true);o+=2}else{v.setUint8(o,q&255);v.setUint8(o+1,(q>>8)&255);v.setUint8(o+2,(q>>16)&255);o+=3}}
 return new Uint8Array(ab);
}

document.addEventListener('keydown',e=>{if(!tourEl)return;e.stopPropagation();
 if(e.key==='Escape'){e.preventDefault();closeTour(true)}else if(e.key==='ArrowRight'||e.key==='Enter'&&e.target.tagName!=='BUTTON'){e.preventDefault();tourAt>=TOUR.length-1?closeTour(true,true):tourGo(tourAt+1)}
 else if(e.key==='ArrowLeft'){e.preventDefault();tourGo(tourAt-1)}},true);

function setTool(t){S.tool=t;$$('[data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===t));content.style.cursor=t==='pencil'?'crosshair':t==='eraser'?'cell':'default'}
$$('[data-tool]').forEach(b=>{b.innerHTML=icon(b.dataset.tool);b.onclick=()=>setTool(b.dataset.tool)});
$('#btnPlay').onclick=togglePlay;
function syncToggles(){
 const r=$('#btnReturn'),f=$('#btnFollow');r.innerHTML=icon('ret');f.innerHTML=icon('follow');
 r.classList.toggle('on',PREFS.returnOnStop);r.setAttribute('aria-pressed',PREFS.returnOnStop);r.title=`停止后回到起点：${PREFS.returnOnStop?'开':'关'}\n开：按空格停止时，播放头回到这次开始播放的位置，方便反复试听同一段`;
 f.classList.toggle('on',PREFS.follow);f.setAttribute('aria-pressed',PREFS.follow);f.title=`跟随播放：${PREFS.follow?'开':'关'}\n开：播放头走到右边缘时卷帘自动翻页`;
 const rb=$('#btnRef');rb.innerHTML=icon('wave')+'原唱参考';rb.classList.toggle('on',PREFS.showRef)}
$('#btnReturn').onclick=()=>{PREFS.returnOnStop=!PREFS.returnOnStop;savePrefs();syncToggles();renderRuler()};
$('#btnFollow').onclick=()=>{PREFS.follow=!PREFS.follow;savePrefs();syncToggles()};
$('#btnRef').onclick=()=>{PREFS.showRef=!PREFS.showRef;savePrefs();syncToggles();renderRoll()};

$('#tc').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.id==='tc'){e.preventDefault();gotoPos()}});
syncToggles();

$('#newDur').innerHTML=NV.map((n,k)=>`<option value="${k}">${n.l}  ${n.n}</option>`).join('');$('#newDur').value=S.newDur;
$('#newDur').onchange=e=>S.newDur=+e.target.value;
$$('[data-ins]').forEach(b=>b.onclick=()=>insert(b.dataset.ins));
$('#bpm').value=S.bpm;$('#bpb').value=S.bpb;$('#ckpt').value=S.ckpt;$('#projName').value=S.name;
