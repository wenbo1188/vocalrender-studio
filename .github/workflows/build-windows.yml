name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'index.html'
      - 'desktop/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build installer and portable exe
        run: npm run dist

      - name: Verify executables
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem dist -Filter '*-Setup.exe')
          $portable = @(Get-ChildItem dist -Filter '*-Portable.exe')
          if ($setup.Count -ne 1 -or $portable.Count -ne 1) {
            throw "Expected exactly one Setup.exe and one Portable.exe"
          }
          $setup + $portable | ForEach-Object { Write-Host "$($_.Name): $($_.Length) bytes" }

      - name: Prepare stable portable filename
        shell: pwsh
        run: |
          $portable = Get-ChildItem dist -Filter '*-Portable.exe' | Select-Object -First 1
          Copy-Item $portable.FullName (Join-Path $portable.DirectoryName 'VocalRender-Studio-Portable.exe')

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VocalRender-Studio-Setup
          path: desktop/dist/*-Setup.exe
          retention-days: 30
          if-no-files-found: error

      - name: Upload portable EXE separately
        uses: actions/upload-artifact@v4
        with:
          name: VocalRender-Studio-Portable
          path: desktop/dist/VocalRender-Studio-Portable.exe
          retention-days: 30
          if-no-files-found: error

      - name: Publish stable portable download link
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view portable-latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create portable-latest --target "$env:GITHUB_SHA" --title "Portable (latest successful build)" --notes "Automatically updated after successful main-branch builds. Download VocalRender-Studio-Portable.exe." --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Unable to create portable release" }
          }
          gh release upload portable-latest "dist/VocalRender-Studio-Portable.exe" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Unable to upload portable EXE" }
